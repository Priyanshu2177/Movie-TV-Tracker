<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Time</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <script src="https://kit.fontawesome.com/4cf2ee64c4.js" crossorigin="anonymous"></script>
    <header>
        <div class="home">
            <img id="logo" src="Assets/logo.png" alt="">
            <span>CINE TIME</span>
        </div>
        <div class="header-actions">
            <div class="search-container">
                <div class="search">
                    <input id="search-bar" type="text" placeholder="Search movies and TV shows...." autocomplete="off">
                    <button class="search-btn" aria-label="Search">
                        <i class="fa-brands fa-sistrix "></i>
                    </button>
                </div>
                <div class="search-results">
                    <div class="search-item">
                        <img src="Assets/placeholder-image.jfif" alt="Interstellar poster" class="poster">
                        <div class="search-info">
                            <h4>Interstellar</h4>
                            <p>
                                <i class="fa-solid fa-clapperboard"></i>
                                <span>2014</span>
                                <span>|</span>
                                <i class="fa-brands fa-imdb"></i>
                                <span>8.7</span>
                            </p>
                        </div>
                        <button class="watchlist-btn" aria-label="Add to Watchlist">
                            <i class="fa-regular fa-square-plus"></i>
                        </button>
                    </div>

                    <div class="search-item">
                        <img src="Assets/placeholder-image.jfif" alt="Invincible poster" class="poster">
                        <div class="search-info">
                            <h4>Invincible</h4>
                            <p>
                                <i class="fa-solid fa-tv"></i>
                                <span>2021</span>
                                <span>|</span>
                                <i class="fa-brands fa-imdb"></i>
                                <span>8.7</span>
                            </p>
                        </div>
                        <button class="watchlist-btn added" aria-label="Remove from Watchlist">
                            <i class="fa-solid fa-square-check"></i>
                        </button>
                    </div>

                    <div class="search-item">
                        <img src="Assets/placeholder-image.jfif" alt="Inception poster" class="poster">
                        <div class="search-info">
                            <h4>Inception</h4>
                            <p>
                                <i class="fa-solid fa-clapperboard"></i>
                                <span>2010</span>
                                <span>|</span>
                                <i class="fa-brands fa-imdb"></i>
                                <span>8.8</span>
                            </p>
                        </div>
                        <button class="watchlist-btn added" aria-label="Remove from watchlist">
                            <i class="fa-solid fa-square-check"></i>
                        </button>
                    </div>

                </div>
            </div>
            <button id="theme-toggle">🌙</button>
        </div>
    </header>

    <main id="content">
        <section id="progress-page" class="page active">
            <div id="progress-tabs" class="media-tabs">
                <button class="active">Watching</button>
                <button>Recent</button>
            </div>
            <div class="media-container">
                <div id="progress-watching" class="media-list active">
                </div>

                <div id="progress-recent" class="media-list">
                </div>
            </div>
        </section>

        <section id="watchlist-page" class="page ">
            <div id="watchlist-tabs" class="media-tabs">
                <button id="movie-btn" class="active">Movies</button>
                <button id="show-btn">Shows</button>
            </div>
            <div class="media-container">
                <div id="watchlist-movies" class="media-list active">
                    
                </div>

                <div id="watchlist-shows" class="media-list">
                    
                </div>

            </div>
        </section>

        <section id="watched-page" class="page">
            <div id="history-tabs" class="media-tabs">
                <button class="active">Movies</button>
                <button>Shows</button>
            </div>
            <div class="media-container">
                <div id="history-movies" class="media-list active">

                </div>

                <div id="history-shows" class="media-list">
                </div>

            </div>
        </section>

        <section id="details-page" class="page">
            <button class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back
            </button>
            <div class="details-container">
                <div class="details-header">
                    <img id="details-poster" src="Assets/progress-image.jpg" alt="Inception" class="details-poster">

                    <div class="details-info">
                        <h1 id="details-title"></h1>
                        <div class="details-rating">
                            <i class="fa-brands fa-imdb imdb"></i>
                            <span id="details-rating"></span>
                        </div>
                        <div id="details-genres" class="details-genres"></div>
                        <div id="details-meta" class="details-meta"></div>

                        <div class="details-actions">
                            <button id="details-watchlist-btn" class="details-btn">
                                <i class="fa-regular fa-bookmark"></i>
                                Watchlist
                            </button>
                            <button id="details-watched-btn" class="details-btn watched">
                                <i class="fa-regular fa-circle-check"></i>
                                Watched
                            </button>
                        </div>
                    </div>

                </div>

                <div class="details-section">
                    <h2>Overview</h2>
                    <p id="details-overview"></p>
                </div>

                <div class="details-section">
                    <h2>Cast</h2>
                    <div id="cast-list" class="cast-list"></div>
                </div>

                <div class="details-section">
                    <h2 id="similar-heading"></h2>
                    <div id="similar-list" class="similar-list"></div>
                </div>

            </div>
        </section>
    </main>

    <div class="bottom">
        <div id="progress-tab" class="navigation active">
            <div class="nav-content">
                <i class="fa-solid fa-arrow-trend-up icon"></i>
                <span>Progress</span>
            </div>
        </div>
        <div id="watchlist-tab" class="navigation ">
            <div class="nav-content">
                <i class="fa-regular fa-calendar-check icon"></i>
                <span>Watchlist</span>
            </div>
        </div>
        <div id="history-tab" class="navigation ">
            <div class="nav-content">
                <i class="fa-solid fa-calendar-check icon"></i>
                <span>History</span>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/tabs.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/watchlist.js"></script>
    <script src="js/history.js"></script>
    <script src="js/details.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
